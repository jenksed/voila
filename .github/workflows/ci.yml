name: CI

# Proves only the pinned supported environment (Node 22.23.1) can pass the
# local verification gate. No release, publishing, matrix, scanning, or deploy.
on:
  pull_request:
  push:
    branches: [main]

# Least privilege: read-only checkout is all this workflow needs.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
