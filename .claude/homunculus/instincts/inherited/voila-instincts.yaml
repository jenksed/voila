# Voila Workflow Add Or Update Verification Receipts

## Action

Follow the add-or-update-verification-receipts workflow:
1. Create or update .voila/receipts/RCP-XX/manifest.json with metadata.
2. Add or update .voila/receipts/RCP-XX/stdout.txt and stderr.txt with output.
3. Update .voila/events.jsonl and .voila/project.json to reflect the verification event.
4. Update .voila/views/PROJECT_STATUS.md to show verification status.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~3x per month
- Files: .voila/receipts/RCP-*/manifest.json, .voila/receipts/RCP-*/stdout.txt, .voila/receipts/RCP-*/stderr.txt

