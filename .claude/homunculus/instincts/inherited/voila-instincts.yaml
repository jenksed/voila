# Voila Workflow Update Project State And Status

## Action

Follow the update-project-state-and-status workflow:
1. Edit .voila/project.json to update the project state or next action.
2. Append to .voila/events.jsonl to record the event.
3. Update .voila/views/PROJECT_STATUS.md with the new status.
4. Optionally update .voila/briefs/PROJECT_BRIEF.md if the project brief changes.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~4x per month
- Files: .voila/project.json, .voila/events.jsonl, .voila/views/PROJECT_STATUS.md

