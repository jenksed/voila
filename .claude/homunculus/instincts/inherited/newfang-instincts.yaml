# Newfang Workflow Schema Migration And State Upgrade

## Action

Follow the schema-migration-and-state-upgrade workflow:
1. Update schema definitions and migration logic (e.g., src/domain/schema-vX.ts, src/domain/migrate.ts).
2. Update or create migration tests and fixtures (e.g., test/migrate-vX.test.ts, test/fixtures/integrated-vX-project.json).
3. Update canonical state files to reflect the new schema (e.g., .newfang/project.json, .newfang/events.jsonl).
4. Ensure all related test suites pass and cover the migration (e.g., test/migrate-chain.test.ts, test/migrate.test.ts).
5. Document the migration and its rationale (e.g., docs/verification/PACKET_X_PROOF_ENGINE.md).

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: src/domain/schema-v3.ts, src/domain/migrate.ts, .newfang/project.json

