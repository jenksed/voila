# Newfang Workflow Recording And Verifying Proof Artifacts

## Action

Follow the recording-and-verifying-proof-artifacts workflow:
1. Generate new claim and/or receipt files under .newfang/receipts/ (e.g., manifest.json, stdout.txt, stderr.txt).
2. Update .newfang/project.json and .newfang/events.jsonl to register the new claims/receipts and log the event.
3. Update related documentation and status views (e.g., .newfang/views/PROJECT_STATUS.md, docs/verification/PACKET_X_PROOF_ENGINE.md).
4. Dogfood or demonstrate the new artifacts by running verification commands and ensuring state transitions are correct.
5. Ensure all changes are reflected in the canonical state and are byte-identical where required.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: .newfang/receipts/RCP-*/manifest.json, .newfang/receipts/RCP-*/stdout.txt, .newfang/receipts/RCP-*/stderr.txt

